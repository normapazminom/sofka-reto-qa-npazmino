serenity {
    take.screenshots = FOR_EACH_ACTION
    restart.browser.for.each = scenario
}

# true = sin ventana del navegador (también se puede usar -Dheadless.mode=true)
headless.mode = false

webdriver {
  driver = chrome
  timeouts.implicitlywait = 10000
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["remote-allow-origins=*", "test-type", "ignore-certificate-errors", "--window-size=1366,900",
        "disable-infobars", "disable-popup-blocking", "disable-extensions",
        "--lang=en-US", "--disable-features=Translate,TranslateUI,TranslateSubFrames", "--disable-notifications"]
    }
  }
}
